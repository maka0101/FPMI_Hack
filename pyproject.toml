[project]
name = "fpmi-mail-search"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<0.29",
    "numpy>=1.26,<3",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
transformers = ["sentence-transformers>=5,<6"]
onnx = ["onnxruntime>=1.19,<2", "tokenizers>=0.22,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
