<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поиск по почте</title>
  <style>
    :root {
      font: 16px/1.5 system-ui, sans-serif;
      color: #18243a;
      background: #f1f4fa;
      --surface: #fff;
      --muted: #54637c;
      --line: #e0e7f2;
      --blue: #3157ce;
      --tint: #eaf0ff;
      --sidebar: #1b2943;
      --sidebar-field: #263752;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: grid;
      grid-template-columns: 15rem minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "brand toolbar" "sidebar workspace";
      min-height: 100svh;
      height: 100svh;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 1.25rem; font-weight: 750; letter-spacing: -.025em; }
    h2 { font-size: 1.25rem; letter-spacing: -.025em; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .65; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    [hidden] { display: none !important; }

    .brand {
      grid-area: brand;
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: 1rem 1.15rem;
      background: var(--sidebar);
      color: white;
    }
    .brand-mark, .reader-mark {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: .6rem;
      background: var(--blue);
      color: white;
    }
    .envelope {
      display: block;
      position: relative;
      width: 1rem;
      height: .75rem;
      border: 1.5px solid currentColor;
      border-radius: .18rem;
      overflow: hidden;
    }
    .envelope::after {
      content: "";
      position: absolute;
      top: -.34rem;
      left: .13rem;
      width: .54rem;
      height: .54rem;
      border: solid currentColor;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }

    .toolbar {
      grid-area: toolbar;
      padding: .9rem clamp(1rem, 2.3vw, 2rem);
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    fieldset { padding: 0; margin: 0; border: 0; min-width: 0; }
    .query-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: .55rem;
      max-width: 50rem;
    }
    .search-input { position: relative; }
    .search-input::before, .search-input::after {
      content: "";
      position: absolute;
      pointer-events: none;
      color: var(--muted);
    }
    .search-input::before {
      top: .85rem;
      left: .9rem;
      width: .62rem;
      height: .62rem;
      border: 1.5px solid currentColor;
      border-radius: 50%;
    }
    .search-input::after {
      top: 1.53rem;
      left: 1.59rem;
      width: .36rem;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      transform-origin: left;
    }
    #query {
      width: 100%;
      min-width: 0;
      min-height: 2.75rem;
      padding: .5rem .8rem .5rem 2.45rem;
      border: 1px solid var(--line);
      border-radius: .6rem;
      background: #f3f6fc;
    }
    .primary {
      padding: .5rem 1.15rem;
      border: 1px solid var(--blue);
      border-radius: .6rem;
      background: var(--blue);
      color: white;
      font-weight: 650;
    }
    .primary:not(:disabled):hover { background: #2648b3; }

    .sidebar {
      grid-area: sidebar;
      min-width: 0;
      padding: .6rem .9rem 1rem;
      background: var(--sidebar);
      color: white;
      overflow: auto;
    }
    .sidebar :focus-visible { outline-color: #b7caff; }
    #mailbox-fields { display: grid; gap: .9rem; }
    .sidebar label { display: grid; gap: .35rem; color: #d0dbee; font-size: .8125rem; font-weight: 600; min-width: 0; }
    .select-wrap { position: relative; display: block; min-width: 0; }
    .select-wrap::after {
      content: "";
      width: .43rem;
      height: .43rem;
      border: solid #c8d8f5;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      position: absolute;
      right: .9rem;
      top: calc(50% - .32rem);
      pointer-events: none;
    }
    #mailbox, #as-of {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 2.75rem;
      padding: .55rem .7rem;
      border: 1px solid #526482;
      border-radius: .6rem;
      background: var(--sidebar-field);
      color: white;
      font-size: .875rem;
    }
    #mailbox { appearance: none; padding-right: 2rem; cursor: pointer; }
    #mailbox option { background: var(--surface); color: #18243a; }
    #as-of { color-scheme: dark; }
    #inbox {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .6rem;
      min-height: 2.75rem;
      padding: .5rem .7rem;
      background: transparent;
      border: 0;
      border-radius: .6rem;
      color: white;
      text-align: left;
      font-weight: 650;
    }
    #inbox:not(:disabled):hover, #inbox[aria-current] { background: #304873; }
    .date-field { padding-top: .75rem; border-top: 1px solid #40516d; }

    main {
      grid-area: workspace;
      display: grid;
      grid-template-columns: minmax(15rem, 2fr) minmax(0, 3fr);
      min-width: 0;
      min-height: 0;
      margin: 1rem clamp(1rem, 2.3vw, 2rem);
      border: 1px solid var(--line);
      border-radius: .85rem;
      background: var(--surface);
      box-shadow: 0 3px 12px #24385c0a;
    }
    .list-pane, .reader { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .list-heading { padding: .9rem 1rem; border-bottom: 1px solid var(--line); }
    .list-heading h2 { margin-bottom: .35rem; }
    .search-info { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .55rem; color: var(--muted); font-size: .8125rem; }
    #target-day {
      background: var(--tint);
      color: #25469e;
      border-radius: .4rem;
      padding: .15rem .45rem;
      font-weight: 650;
    }
    #results { overflow: auto; flex: 1; min-height: 0; border-radius: 0 0 0 .85rem; }
    #results button {
      width: 100%;
      display: grid;
      gap: .3rem;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-inline-start: 3px solid transparent;
      background: var(--surface);
      padding: .75rem .9rem;
      overflow-wrap: anywhere;
    }
    #results button:hover { background: #f6f8fd; }
    #results button[aria-current="true"] { background: var(--tint); border-inline-start-color: var(--blue); }
    #results button:focus-visible { outline-offset: -4px; }
    .row-title { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .15rem .5rem; }
    .row-title strong { font-size: .875rem; }
    #results small, .preview { color: var(--muted); font-size: .8125rem; }
    .preview { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }

    .reader { border-inline-start: 1px solid var(--line); }
    #message { overflow: auto; flex: 1; min-height: 0; padding: clamp(1rem, 2.5vw, 2.2rem); }
    #message:focus-visible { outline-offset: -4px; }
    #message h2 { font-size: clamp(1.25rem, 2.2vw, 1.65rem); overflow-wrap: anywhere; }
    #message p { color: var(--muted); }
    #message .mail-date { margin: .35rem 0 1.25rem; }
    .reader-empty { display: grid; place-content: center; justify-items: center; gap: .8rem; height: 100%; text-align: center; }
    .reader-mark { width: 2.75rem; height: 2.75rem; background: var(--tint); color: var(--blue); }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; line-height: 1.65; max-width: 72ch; margin: 0; padding-top: 1rem; border-top: 1px solid var(--line); }
    .secondary {
      background: var(--surface);
      color: #25469e;
      border: 1px solid #aab9d2;
      border-radius: .55rem;
      padding: .5rem .75rem;
      min-height: 2.75rem;
      width: fit-content;
    }
    .secondary:hover { background: var(--tint); }
    #search-retry, #message .secondary { margin-top: .65rem; }
    #back { display: none; margin: 1rem 1rem 0; }

    @media (max-width: 55rem) {
      body {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto auto 1fr;
        grid-template-areas: "brand" "toolbar" "sidebar" "workspace";
        height: auto;
      }
      .brand { padding: .75rem 1rem; }
      .toolbar { padding: .65rem 1rem; }
      .sidebar { overflow: visible; padding: .7rem 1rem; }
      #mailbox-fields { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: end; gap: .6rem; }
      #inbox { grid-column: 1 / -1; }
      .date-field { padding-top: 0; border-top: 0; }
      main { display: block; margin: .75rem 1rem 1rem; }
      #results { border-radius: 0 0 .85rem .85rem; }
      .reader { display: none; border: 0; }
      body[data-reading] { grid-template-rows: auto 0 0 1fr; }
      body[data-reading] .toolbar, body[data-reading] .sidebar, body[data-reading] .list-pane { display: none; }
      body[data-reading] .reader { display: flex; }
      #back { display: block; }
    }
  </style>
</head>
<body>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"><span class="envelope"></span></span>
    <h1>Почта</h1>
  </header>
  <form id="search" class="toolbar" role="search">
    <fieldset id="search-fields" disabled>
      <div class="query-row">
        <div class="search-input">
          <input id="query" aria-label="Запрос" type="search" maxlength="1000" placeholder="Поиск по письмам">
        </div>
        <button class="primary" type="submit">Найти</button>
      </div>
    </fieldset>
  </form>
  <aside class="sidebar" aria-label="Почтовый ящик и папки">
    <fieldset id="mailbox-fields" disabled>
      <label>
        Почтовый ящик
        <span class="select-wrap"><select id="mailbox" form="search" required></select></span>
      </label>
      <label class="date-field">Дата отсчёта<input id="as-of" form="search" type="date" required></label>
      <button id="inbox" type="button" aria-current="page"><span class="envelope" aria-hidden="true"></span>Входящие</button>
    </fieldset>
  </aside>
  <main>
    <section class="list-pane" aria-labelledby="results-heading">
      <div class="list-heading">
        <h2 id="results-heading">Входящие</h2>
        <div class="search-info" role="status">
          <span id="status"></span>
          <span id="target-day" hidden></span>
          <span id="search-mode" hidden>Поиск по словам</span>
        </div>
        <button id="search-retry" class="secondary" type="button" hidden>Повторить</button>
      </div>
      <div id="results"></div>
    </section>
    <section class="reader" aria-label="Открытое письмо">
      <button id="back" class="secondary" type="button">К результатам</button>
      <article id="message" tabindex="-1" aria-live="polite"></article>
    </section>
  </main>
  <template id="reader-placeholder">
    <div class="reader-empty">
      <span class="reader-mark" aria-hidden="true"><span class="envelope"></span></span>
      <p>Выберите письмо из списка.</p>
    </div>
  </template>
  <script>
    const form = document.querySelector("#search");
    const fields = document.querySelector("#search-fields");
    const mailboxFields = document.querySelector("#mailbox-fields");
    const inbox = document.querySelector("#inbox");
    const heading = document.querySelector("#results-heading");
    const readerPlaceholder = document.querySelector("#reader-placeholder");
    const mailbox = document.querySelector("#mailbox");
    const asOf = document.querySelector("#as-of");
    const query = document.querySelector("#query");
    const results = document.querySelector("#results");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const targetDay = document.querySelector("#target-day");
    const searchMode = document.querySelector("#search-mode");
    const searchRetry = document.querySelector("#search-retry");
    const back = document.querySelector("#back");
    const mobile = window.matchMedia("(max-width: 55rem)");
    const dateFormat = new Intl.DateTimeFormat("ru-RU", {
      day: "numeric", month: "long", year: "numeric", timeZone: "UTC"
    });
    let mailboxes = {};
    let searchVersion = 0;
    let messageVersion = 0;
    let scrollBeforeReading = 0;
    let retrySearch = null;

    function node(tag, text) {
      const element = document.createElement(tag);
      element.textContent = text;
      return element;
    }

    function formatDay(day) {
      if (!day) return "Дата неизвестна";
      const date = new Date(day + "T00:00:00Z");
      return Number.isNaN(date.getTime()) ? day : dateFormat.format(date);
    }

    function scope() {
      return { mailbox: mailbox.value, as_of: asOf.value };
    }

    function setDefaultDay() {
      const today = new Date();
      const localDay = [
        today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, "0"),
        String(today.getDate()).padStart(2, "0")
      ].join("-");
      asOf.value = mailboxes[mailbox.value] || localDay;
      mailbox.title = mailbox.value;
    }

    async function get(path, params = {}) {
      const response = await fetch(path + "?" + new URLSearchParams(params));
      if (!response.ok) {
        const error = new Error("Ошибка запроса");
        error.status = response.status;
        throw error;
      }
      return { data: await response.json(), headers: response.headers };
    }

    function resetReader() {
      message.replaceChildren(readerPlaceholder.content.cloneNode(true));
    }

    function focusMessage() {
      if (mobile.matches) message.focus({ preventScroll: true });
    }

    function returnToResults() {
      ++messageVersion;
      document.body.removeAttribute("data-reading");
      resetReader();
      results.querySelector("[aria-current]")?.focus({ preventScroll: true });
      window.scrollTo(0, scrollBeforeReading);
    }

    async function openMessage(docId, button, messageScope) {
      const version = ++messageVersion;
      if (mobile.matches && !document.body.hasAttribute("data-reading")) {
        scrollBeforeReading = window.scrollY;
        window.scrollTo(0, 0);
      }
      document.body.setAttribute("data-reading", "");
      results.querySelector("[aria-current]")?.removeAttribute("aria-current");
      button.setAttribute("aria-current", "true");
      message.replaceChildren(node("p", "Открываем письмо…"));
      message.scrollTop = 0;
      focusMessage();
      try {
        const { data: mail } = await get("/api/message", { ...messageScope, doc_id: docId });
        if (version !== messageVersion) return;
        const day = node("p", formatDay(mail.day));
        day.className = "mail-date";
        message.replaceChildren(node("h2", mail.subject || "Без темы"), day, node("pre", mail.body));
      } catch (error) {
        if (version !== messageVersion) return;
        if (error.status === 404) {
          message.replaceChildren(node("p", "Письмо недоступно. Выберите другое в списке."));
          return;
        }
        const retry = node("button", "Открыть снова");
        retry.type = "button";
        retry.className = "secondary";
        retry.addEventListener("click", () => openMessage(docId, button, messageScope));
        message.replaceChildren(node("p", "Не удалось открыть письмо."), retry);
      }
    }

    function renderResults(rows, requestScope) {
      for (const row of rows) {
        const button = node("button", "");
        button.type = "button";
        const title = node("span", "");
        title.className = "row-title";
        title.append(node("strong", row.subject || "Без темы"), node("small", formatDay(row.day)));
        const preview = node("span", row.subject ? row.preview.replace(/^Тема:[^\n]*(?:\n|$)/i, "").trim() : row.preview);
        preview.className = "preview";
        button.append(title, preview);
        button.addEventListener("click", () => openMessage(row.doc_id, button, requestScope));
        results.append(button);
      }
    }

    function showSearchError(text, retry) {
      status.textContent = text;
      retrySearch = retry;
      searchRetry.hidden = false;
    }

    async function search() {
      if (!form.reportValidity()) return;
      const version = ++searchVersion;
      ++messageVersion;
      document.body.removeAttribute("data-reading");
      targetDay.hidden = true;
      searchMode.hidden = true;
      searchRetry.hidden = true;
      status.textContent = "Ищем письма…";
      resetReader();
      results.replaceChildren();
      const requestScope = scope();
      const requestQuery = query.value.trim();
      heading.textContent = requestQuery ? "Результаты поиска" : "Входящие";
      if (requestQuery) inbox.removeAttribute("aria-current");
      else inbox.setAttribute("aria-current", "page");
      try {
        const { data: rows, headers } = await get("/api/search", { ...requestScope, q: requestQuery });
        if (version !== searchVersion) return;
        if (requestQuery) {
          status.textContent = rows.length ? `Писем в выдаче: ${rows.length}` : "Письма не найдены. Попробуйте другой запрос.";
        } else {
          status.textContent = rows.length ? `Показано: ${rows.length}` : "На эту дату в ящике нет писем.";
        }
        const day = headers.get("X-Target-Day");
        if (day) {
          targetDay.textContent = "За " + formatDay(day);
          targetDay.hidden = false;
        }
        searchMode.hidden = headers.get("X-Search-Mode") !== "bm25-fallback";
        renderResults(rows, requestScope);
      } catch (error) {
        if (version !== searchVersion) return;
        const text = error.status === 503 ? "Поиск временно недоступен." : "Не удалось загрузить письма.";
        showSearchError(text, search);
      }
    }

    async function loadMailboxes() {
      searchRetry.hidden = true;
      status.textContent = "Загружаем почтовые ящики…";
      try {
        const { data } = await get("/api/mailboxes");
        mailboxes = data;
        const ids = Object.keys(data);
        if (!ids.length) {
          status.textContent = "Нет доступных почтовых ящиков.";
          return;
        }
        const options = ids.map((id, index) => {
          const number = String(index + 1).padStart(2, "0");
          const suffix = id.slice(-4);
          return new Option(`Ящик ${number} · ${suffix}`, id);
        });
        mailbox.replaceChildren(...options);
        setDefaultDay();
        fields.disabled = false;
        mailboxFields.disabled = false;
        search();
      } catch {
        showSearchError("Не удалось загрузить почтовые ящики.", loadMailboxes);
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      search();
    });
    inbox.addEventListener("click", () => {
      query.value = "";
      search();
    });
    mailbox.addEventListener("change", () => {
      query.value = "";
      setDefaultDay();
      search();
    });
    asOf.addEventListener("change", () => {
      if (asOf.value) search();
    });
    searchRetry.addEventListener("click", () => {
      const focusTarget = fields.disabled ? searchRetry : query;
      focusTarget.focus();
      retrySearch?.();
    });
    back.addEventListener("click", returnToResults);

    resetReader();
    loadMailboxes();
  </script>
</body>
</html>
